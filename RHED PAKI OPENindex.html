<script>
/* ============ AUDIO ============ */
let audioCtx = null, muted = false;
function initAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  type = type || 'square'; vol = vol || 0.06;
  if (muted || !audioCtx) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function playClick() { beep(880, 0.06, 'square', 0.05); }
function playPop() { beep([1000,1200,1400,1600][Math.floor(Math.random()*4)], 0.08, 'square', 0.07); }
function playLevelUp() { [523,659,784,1047].forEach((n,i)=>setTimeout(()=>beep(n,0.14,'square',0.07),i*90)); }
function playFinalWin() { [523,659,784,1047,1319,1047,1319,1568].forEach((n,i)=>setTimeout(()=>beep(n,0.22,'square',0.08),i*140)); }
function playStart() { [392,523,659,784].forEach((n,i)=>setTimeout(()=>beep(n,0.12,'triangle',0.07),i*80)); }
function playJump() { beep(600, 0.1, 'square', 0.05); beep(900, 0.1, 'square', 0.04); }
function playBlip() { beep(440, 0.05, 'square', 0.04); }
function playWarning() { [880, 660, 880, 660].forEach((n,i)=>setTimeout(()=>beep(n,0.15,'sawtooth',0.06),i*100)); }
function playExplode() {
  if (muted || !audioCtx) return;
  const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.7, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);

let swTimer = null, swPlaying = false;

function playStarWarsTheme() {
  if (!audioCtx) return;
  swPlaying = true;
  let time = audioCtx.currentTime + 0.1;
  let totalDur = 0;
  SW_MELODY.forEach(([note, dur]) => {
    if (note && !muted) {
      const freq = SW_NOTES[note];
      if (freq) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.09, time + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, time + dur * 0.95);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(time); osc.stop(time + dur);
      }
    }
    time += dur * 0.95;
    totalDur += dur * 0.95;
  });
  swTimer = setTimeout(() => { if (swPlaying) playStarWarsTheme(); }, totalDur * 1000 + 300);
}

/* ============ PHASE UPDATES ============ */
function updateRun() {
  const r = runGame.rhed;
  const speed = 2.2;
  r.vy += 0.5; r.y += r.vy;
  const groundLevel = runGame.groundY - r.h;
  let supportY = groundLevel;
  for (const b of runGame.buildings) {
    const bx = b.x - runGame.camX;
    if (r.x + r.w > bx && r.x < bx + b.w) {
      const topY = b.y - r.h;
      if (r.y >= topY - 5 && r.y <= topY + 30 && r.vy >= 0) supportY = Math.min(supportY, topY);
    }
  }
  if (r.y >= supportY) { r.y = supportY; r.vy = 0; r.onGround = true; }
  else r.onGround = false;
  if (!runGame.finished) { runGame.camX += speed; r.animFrame += 0.2; }
  const progress = Math.min(1, runGame.camX / (runGame.totalDistance - 300));
  if (progress >= 1 && !runGame.endTriggered) {
    runGame.endTriggered = true; runGame.finished = true;
    setTimeout(() => { runGame.phase = 'giveCake'; runGame.sceneTime = 0; runGame.lightIntensity = 0; }, 800);
  }
  if (runGame.finished) {
    const endX = 240;
    if (r.x < endX) { r.x += 2; r.animFrame += 0.2; }
  } else r.x = 60;
}
function renderRun() {
  const progress = Math.min(1, runGame.camX / (runGame.totalDistance - 300));
  drawSky(progress);
  ctx.globalAlpha = 0.25;
  for (let i = 0; i < 20; i++) {
    const px = ((i * 120) - (runGame.camX * 0.3)) % (VW + 200);
    const actualX = px < 0 ? px + VW + 200 : px;
    const bh = 40 + (i * 17) % 60;
    ctx.fillStyle = progress < 0.5 ? '#b967ff' : '#3a1a6a';
    ctx.fillRect(actualX, runGame.groundY - bh - 30, 60, bh + 30);
  }
  ctx.globalAlpha = 1;
  runGame.buildings.forEach(b => drawBuilding(b, runGame.camX));
  drawGround(runGame.camX);
  if (runGame.endTriggered) {
    const endX = runGame.totalDistance - runGame.camX + 200;
    if (endX < VW + 100) drawLightPillar(endX, runGame.groundY, runGame.lightIntensity);
  }
  drawRhed(runGame.rhed.x, runGame.rhed.y, Math.floor(runGame.rhed.animFrame), runGame.rhed.onGround, false);
  ctx.save();
  ctx.font = "bold 12px 'Press Start 2P', 'Courier New', monospace";
  ctx.fillStyle = '#00f0ff'; ctx.shadowBlur = 8; ctx.shadowColor = '#00f0ff';
  ctx.fillText('◆ RHED ADVENTURE', 12, 22);
  ctx.fillStyle = '#ffd93d'; ctx.shadowColor = '#ffd93d';
  ctx.fillText(`PROGRESS: ${Math.round(progress * 100)}%`, 12, 40);
  ctx.restore();
  ctx.fillStyle = 'rgba(0,240,255,0.2)'; ctx.fillRect(VW - 160, 14, 148, 10);
  ctx.fillStyle = '#ff2d95'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff2d95';
  ctx.fillRect(VW - 160, 14, 148 * progress, 10);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.strokeRect(VW - 160, 14, 148, 10);
}

function updateFlyAway() {
  runGame.sceneTime++;

  a.flying = true;

  else { a.y = HOVER_Y; a.hover = true; a.x += Math.sin(runGame.time * 0.005) * 0.3; }
  if (a.hover && !runGame.ufo.spawned) {
    runGame.ufo.spawned = true;
    runGame.ufo.x = VW + 100;
    runGame.ufo.y = HOVER_Y;
    runGame.ufo.vx = -3.5;
    playWarning();
  }
  if (runGame.ufo.spawned) {
    runGame.ufo.x += runGame.ufo.vx;
    if (runGame.ufo.x <= a.x + 25) {
      runGame.phase = 'ufoCrash';
      runGame.sceneTime = 0;
      runGame.ufo.hit = true;
      runGame.ufo.explosionTime = 0;
      playExplode();
      let shakes = 20;
      const shakeInt = setInterval(() => {
        const sx = (Math.random() - 0.5) * 18;
        const sy = (Math.random() - 0.5) * 18;
        cvs.style.transform = `translate(${sx}px, ${sy}px)`;
        shakes--;
        if (shakes <= 0) { clearInterval(shakeInt); cvs.style.transform = 'translate(0,0)'; }
      }, 40);
    }
  }
}
function renderFlyAway() {
  renderRun();
  const a = runGame.angel;
  drawJohnAngel(a.x, a.y, Math.sin(runGame.time * 0.02) * 10, false);
  if (runGame.ufo.spawned) {
    drawUFO(runGame.ufo.x, runGame.ufo.y);
    if (runGame.ufo.x > a.x + 40) {
      ctx.save();
      ctx.font = "bold 14px 'Press Start 2P', 'Courier New', monospace"; ctx.textAlign = 'center';
      ctx.fillStyle = '#ff2020'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff2020';
      ctx.globalAlpha = Math.sin(runGame.time * 0.02) > 0 ? 1 : 0.3;
      ctx.fillText('⚠ WARNING ⚠', VW / 2, VH - 40);
      ctx.restore();
    }
  }
  ctx.save();
  ctx.font = "bold 11px 'Press Start 2P', 'Courier New', monospace"; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd93d'; ctx.shadowBlur = 10; ctx.shadowColor = '#ffd93d';
  ctx.fillText('◆ PAPALIPAD NA SI JOHN... ◆', VW / 2, VH - 15);
  ctx.restore();
}

function updateUFOCrash() {
  runGame.sceneTime++;
  const a = runGame.angel;
  const u = runGame.ufo;
  u.x += u.vx * 0.7; u.y += 0.5;
  a.x += 0.8; a.y += 2; a.flying = false;
  if (runGame.sceneTime > 90) {
    runGame.phase = 'crashLand';
    runGame.sceneTime = 0;
  }
}
function renderUFOCrash() {
  renderRun();
  const a = runGame.angel;
  const u = runGame.ufo;
  const e = runGame.ufo.explosionTime++;
  const cxp = a.x + 20, cyp = a.y;
  const rad = Math.min(120, e * 6);
  const g = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, rad);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.2, 'rgba(255,255,100,1)');
  g.addColorStop(0.4, 'rgba(255,150,0,0.9)');
  g.addColorStop(0.7, 'rgba(255,45,149,0.6)');
  g.addColorStop(1, 'rgba(255,45,149,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cxp, cyp, rad, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 12; i++) {
    const ang = (i * Math.PI / 6) + runGame.time * 0.002;
    const rr = 20 + (e * 3) + Math.sin(i * 5) * 15;
    const dx = cxp + Math.cos(ang) * rr;
    const dy = cyp + Math.sin(ang) * rr;
    const color = i % 3 === 0 ? '#b967ff' : i % 3 === 1 ? '#00f0ff' : '#ff2d95';
    ctx.fillStyle = color;
    ctx.save(); ctx.translate(dx, dy); ctx.rotate(ang);
    ctx.fillRect(-4, -4, 8, 8); ctx.restore();
  }
  if (e < 40) {
    ctx.save(); ctx.translate(cxp, cyp);
    const scale = Math.min(1.8, 0.5 + e * 0.1);
    ctx.scale(scale, scale);
    ctx.font = "bold 32px 'Press Start 2P', 'Courier New', monospace";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
    ctx.strokeText('BANG!', 0, 0);
    ctx.fillStyle = '#ffd93d'; ctx.shadowBlur = 30; ctx.shadowColor = '#ff2d95';
    ctx.fillText('BANG!', 0, 0);
    ctx.restore();
  }
  ctx.save(); ctx.translate(u.x, u.y); ctx.rotate(e * 0.15);
  drawUFO(0, 0); ctx.restore();
  drawJohnAngel(a.x, a.y, 0, false);
  if (e < 8) {
    ctx.fillStyle = `rgba(255,255,255,${(8 - e) / 8 * 0.8})`;
    ctx.fillRect(0, 0, VW, VH);
  }
}

function updateCrashLand() {
  runGame.sceneTime++;
  const a = runGame.angel;
  const r = runGame.rhed;
  const groundJohnY = runGame.groundY - 60;
  if (a.y < groundJohnY) { a.y += 3; a.x += 0.4; }
  else a.y = groundJohnY;
  if (runGame.sceneTime > 30) {
    const targetX = a.x - 70;
    if (r.x < targetX) { r.x += 2.5; r.animFrame += 0.3; }
    else if (r.x > targetX) { r.x -= 2.5; r.animFrame += 0.3; }
  }
  if (runGame.sceneTime > 120 && runGame.john.state === 'angel') {
    runGame.john.state = 'fallen';
    playBlip();
  }
  if (runGame.sceneTime > 220 && runGame.john.state === 'fallen') {
    runGame.john.state = 'normal';
    playBlip();
  }
  if (runGame.sceneTime > 350) {
    runGame.phase = 'dialogue2';
    runGame.sceneTime = 0;
    startDialogue2();
  }
}
function renderCrashLand() {
  renderRun();
  const a = runGame.angel;
  const r = runGame.rhed;
  for (let i = 0; i < 5; i++) {
    const t = runGame.time * 0.003 + i;
    const smX = a.x + 20 + Math.sin(t * 3) * 18;
    const smY = runGame.groundY - 40 - Math.abs(Math.sin(t * 2)) * 25;
    ctx.fillStyle = `rgba(180,180,180,${0.5 - i * 0.09})`;
    ctx.beginPath(); ctx.arc(smX, smY, 8 + i * 2, 0, Math.PI * 2); ctx.fill();
  }
  if (runGame.john.state === 'angel') drawJohnAngel(a.x, a.y, 0, false);
  else if (runGame.john.state === 'fallen') drawJohnFallen(a.x, a.y + 20);
  else drawJohnNormal(a.x, a.y + 30);
  drawRhed(r.x, r.y, Math.floor(r.animFrame), r.onGround, false);
  ctx.save();
  ctx.font = "bold 9px 'Press Start 2P', 'Courier New', monospace"; ctx.textAlign = 'center';
  if (runGame.john.state === 'angel') {
    ctx.fillStyle = '#ff2d95'; ctx.shadowBlur = 8; ctx.shadowColor = '#ff2d95';
    ctx.fillText('◆ JOHN THE FALLEN ANGEL ◆', a.x + 20, a.y - 30);
  } else if (runGame.john.state === 'fallen') {
    ctx.fillStyle = '#ffd93d'; ctx.shadowBlur = 8; ctx.shadowColor = '#ffd93d';
    ctx.fillText('◆ JOHN (BUMAGSAK) ◆', a.x + 20, a.y - 10);
  } else if (runGame.john.state === 'normal') {
    ctx.fillStyle = '#00f0ff'; ctx.shadowBlur = 8; ctx.shadowColor = '#00f0ff';
    ctx.fillText('◆ JOHN (NORMAL NA) ◆', a.x + 20, a.y - 10);
  }
  ctx.restore();
  ctx.save();
  ctx.font = "bold 10px 'Press Start 2P', 'Courier New', monospace"; ctx.textAlign = 'center';
  ctx.fillStyle = '#ff2d95'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff2d95';
  ctx.fillText('◆ CRASH LANDING! NAGING TAO SI JOHN! ◆', VW / 2, VH - 15);
  ctx.restore();
}

function startDialogue2() {
  startDialogue([
    { speaker: 'RHED', text: 'Ok kalang John? 😟', color: '#00f0ff' },
    { speaker: 'JOHN', text: 'Oo ok lang ako! Pahingi nalang ako ng Shanghai HEHHEHE 😂', color: '#ff2d95' }
  ], () => {
    runGame.phase = 'heaven';
    runGame.sceneTime = 0;
    playAngry();
  });
}

function updateHeaven() {
  runGame.sceneTime++;
  if (runGame.sceneTime > 500) {
    runGame.phase = 'done';
    startCredits();
  }
}
function renderHeaven() { drawHeavenScene(); }

/* ============ GAME LOOP ============ */
function gameLoop(t) {
  const dt = t - lastTime; lastTime = t; runGame.time += dt;
  if (tapPending) {
    if (dialogue.active) tryAdvanceDialogue();
    tapPending = false;
  }
  ctx.clearRect(0, 0, VW, VH);
  try {
    switch (runGame.phase) {
      case 'run': updateRun(); renderRun(); break;
      case 'giveCake': updateGiveCake(); renderGiveCake(); break;
      case 'dialogue1': updateGiveCake(); renderGiveCake(); drawDialogue(); break;
      case 'flyAway': updateFlyAway(); renderFlyAway(); break;
      case 'ufoCrash': updateUFOCrash(); renderUFOCrash(); break;
      case 'crashLand': updateCrashLand(); renderCrashLand(); break;
      case 'dialogue2': updateCrashLand(); renderCrashLand(); drawDialogue(); break;
      case 'heaven': updateHeaven(); renderHeaven(); break;
      case 'done': renderHeaven(); break;
    }
  } catch (err) { console.error(err); }
  rafId = requestAnimationFrame(gameLoop);
}

function startRhedAdventure() {
  Object.assign(runGame, {
    phase: 'run', time: 0, sceneTime: 0, camX: 0,
    rhed: { x: 60, y: 250, vy: 0, w: 30, h: 50, onGround: true, animFrame: 0 },
    john: { state: 'angel' },
    finished: false, endTriggered: false, lightIntensity: 0,
    angel: { x: VW + 80, y: 130, entered: false, flying: false, hover: false },
    cake: { held: 'angel' },
    ufo: { x: -100, y: 60, vx: 0, hit: false, explosionTime: 0, spawned: false }
  });
  runGame.rhed.x = 60;
  runGame.lightningBolts = [];
  dialogue.active = false;
  if (rafId) cancelAnimationFrame(rafId);
  lastTime = performance.now();
  rafId = requestAnimationFrame(gameLoop);
}

/* ✅ SHOW PHOTOS instead of going back to title */
function endCredits() {
  stopStarWarsTheme();
  document.getElementById('creditsScene').classList.remove('active');
  if (rafId) cancelAnimationFrame(rafId);
  runGame.phase = 'done';
  hideGameCanvas();

  /* Show photos scene */
  const photosScene = document.getElementById('photosScene');
  photosScene.classList.add('active');
  launchConfetti();
}

/* ✅ Back to title (para sa PLAY AGAIN button) */
function backToTitle() {
  document.getElementById('photosScene').classList.remove('active');
  showTitle();
}

/* ============ CONFETTI (OFFLINE-OPTIMIZED) ============ */
const confettiCanvas = document.getElementById('confetti');
const cctx = confettiCanvas.getContext('2d');
function resizeConfetti() { confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
resizeConfetti();
window.addEventListener('resize', resizeConfetti);
let pieces = [];
const COLORS = ['#ff2d95', '#b967ff', '#00f0ff', '#ffd93d', '#ff69b4'];
function launchConfetti() {
  for (let i = 0; i < 200; i++) pieces.push({
    x: Math.random() * confettiCanvas.width, y: -20,
    size: Math.random() * 9 + 5, vy: Math.random() * 4 + 2, vx: Math.random() * 4 - 2,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    rot: Math.random() * 360, rs: Math.random() * 10 - 5,
    shape: Math.random() > 0.5 ? 'heart' : 'rect'
  });
}
function drawHeartShape(c, x, y, size, color, rot) {
  c.save(); c.translate(x, y); c.rotate(rot * Math.PI / 180);
  c.fillStyle = color; c.shadowBlur = 10; c.shadowColor = color;
  c.beginPath();
  const s = size / 20;
  c.moveTo(0, 5 * s);
  c.bezierCurveTo(0, 0, -10 * s, 0, -10 * s, 7 * s);
  c.bezierCurveTo(-10 * s, 13 * s, 0, 18 * s, 0, 22 * s);
  c.bezierCurveTo(0, 18 * s, 10 * s, 13 * s, 10 * s, 7 * s);
  c.bezierCurveTo(10 * s, 0, 0, 0, 0, 5 * s);
  c.fill(); c.restore();
}
function animateConfetti() {
  if (pieces.length > 0) {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    pieces = pieces.filter(p => p.y < confettiCanvas.height + 40);
    for (let i = 0; i < pieces.length; i++) {
      const p = pieces[i];
      p.y += p.vy; p.x += p.vx; p.rot += p.rs;
      if (p.shape === 'heart') drawHeartShape(cctx, p.x, p.y, p.size, p.color, p.rot);
      else {
        cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.rot * Math.PI / 180);
        cctx.fillStyle = p.color; cctx.shadowBlur = 8; cctx.shadowColor = p.color;
        cctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        cctx.restore();
      }
    }
  }
  requestAnimationFrame(animateConfetti);
}
animateConfetti();

/* ============ BOOT ============ */
showTitle();
